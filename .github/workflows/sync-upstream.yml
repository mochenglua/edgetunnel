# ============================================================
# 覆盖式同步上游 edgetunnel 到 fork (main 分支)
# 注意: 会丢弃你 fork 上的所有本地改动
# 前置条件: 仓库 Settings -> Actions -> General ->
#           Workflow permissions 选 "Read and write permissions"
# ============================================================
name: Sync upstream

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork (main)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Force reset to upstream
        run: |
          git remote add upstream https://github.com/zizifn/edgetunnel.git
          git fetch upstream
          git checkout main
          git reset --hard upstream/main
          git push origin main --force
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
