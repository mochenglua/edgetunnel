# ============================================================
# 覆盖式同步上游 edgetunnel 到 fork (main 分支)
# 无冲突风险: 完全重置为上游最新代码
# 注意: 会丢弃你 fork 上的所有本地改动
# ============================================================
name: Sync upstream

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      workflows: write   # 允许更新 .github/workflows/ 下的文件, 否则同步上游会拒绝

    steps:
      - name: Checkout fork (main)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Force reset to upstream
        run: |
          git remote add upstream https://github.com/zizifn/edgetunnel.git
          git fetch upstream
          git checkout main
          git reset --hard upstream/main
          git push origin main --force
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
